services:
  db:
    image: postgres:16-alpine
    container_name: match_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-devops_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devops_pass}
      POSTGRES_DB: ${DB_NAME:-match_tracker_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devops_user} -d ${DB_NAME:-match_tracker_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: match_tracker_backend
    restart: unless-stopped
    environment:
      PORT: ${BACKEND_PORT:-5000}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-devops_user}
      DB_PASSWORD: ${DB_PASSWORD:-devops_pass}
      DB_NAME: ${DB_NAME:-match_tracker_db}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: match_tracker_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - app_net

volumes:
  pgdata:

networks:
  app_net:
    driver: bridge
